name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true

      # A project site is served from https://<owner>.github.io/<repo>/, so the
      # build overrides url and baseurl from _config.yml, which describe
      # documentation.cluedin.net. _plugins/baseurl_links.rb prefixes the
      # root-relative links in the articles with the baseurl.
      - name: Build site
        env:
          JEKYLL_ENV: production
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          printf 'url: "https://%s.github.io"\nbaseurl: "/%s"\n' \
            "${OWNER,,}" "$REPO" > _config.pages.yml
          bundle exec jekyll build -d build --config _config.yml,_config.pages.yml

      # CNAME belongs to documentation.cluedin.net. Publishing it from here
      # would point this repository's Pages site at that domain.
      - name: Drop the production CNAME
        run: rm -f build/CNAME

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build
          enable_jekyll: false
